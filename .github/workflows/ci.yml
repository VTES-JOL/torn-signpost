name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Backend integration tests (architecture §11) run against DynamoDB Local.
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Browser tests (docs/testing.md) against the built web app, the local API and DynamoDB Local.
      - name: End-to-end tests
        run: |
          pnpm --filter @torn-signpost/web exec playwright install --with-deps chromium
          pnpm --filter @torn-signpost/web test:e2e
      - name: Keep end-to-end traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: apps/web/test-results/
          retention-days: 7
      - name: CDK synth
        run: pnpm --filter @torn-signpost/infra synth

  deploy:
    # main deploys straight to the live beta (architecture §9): no staging environment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: verify
    runs-on: ubuntu-latest
    environment: beta
    concurrency:
      group: deploy-beta
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: CDK deploy
        working-directory: infra
        run: pnpm exec cdk deploy --all --require-approval never
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS https://api.tornsignpost.org/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS https://tornsignpost.org/config.json | grep -q '"stage":"beta"'
          curl -fsS https://tornsignpost.org/config.json | grep -q '"wsUrl":"wss://ws.tornsignpost.org"'
          curl -fsS https://tornsignpost.org/ | grep -q '<div id="root">'
